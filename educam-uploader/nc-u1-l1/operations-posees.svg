<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="675" rx="24" fill="#F8FAFC"/>
  <text x="600" y="72" text-anchor="middle" font-size="42" font-weight="700" fill="#1E293B">Poser l'opération : bien aligner les chiffres par rang</text>

  <!-- ===== ADDITION (left) ===== -->
  <text x="330" y="170" text-anchor="middle" font-size="32" font-weight="700" fill="#2563EB">Addition</text>
  <g font-family="'Courier New', monospace" font-size="60" font-weight="700" fill="#0F172A" text-anchor="end">
    <text x="470" y="270">18 500</text>
    <text x="470" y="350">3 750</text>
  </g>
  <text x="170" y="350" font-size="60" font-weight="700" fill="#2563EB">+</text>
  <line x1="150" y1="378" x2="490" y2="378" stroke="#1E293B" stroke-width="4"/>
  <g font-family="'Courier New', monospace" font-size="60" font-weight="700" fill="#2563EB" text-anchor="end">
    <text x="470" y="460">22 250</text>
  </g>
  <text x="330" y="530" text-anchor="middle" font-size="26" fill="#475569">Un sac de riz (18 500) + de l'huile (3 750)</text>
  <text x="330" y="565" text-anchor="middle" font-size="26" fill="#475569">= 22 250 FCFA</text>

  <!-- divider -->
  <line x1="620" y1="150" x2="620" y2="590" stroke="#E2E8F0" stroke-width="3"/>

  <!-- ===== SUBTRACTION (right) ===== -->
  <text x="900" y="170" text-anchor="middle" font-size="32" font-weight="700" fill="#059669">Soustraction</text>
  <g font-family="'Courier New', monospace" font-size="60" font-weight="700" fill="#0F172A" text-anchor="end">
    <text x="1040" y="270">50 000</text>
    <text x="1040" y="350">12 800</text>
  </g>
  <text x="740" y="350" font-size="60" font-weight="700" fill="#059669">&#8722;</text>
  <line x1="720" y1="378" x2="1060" y2="378" stroke="#1E293B" stroke-width="4"/>
  <g font-family="'Courier New', monospace" font-size="60" font-weight="700" fill="#059669" text-anchor="end">
    <text x="1040" y="460">37 200</text>
  </g>
  <text x="900" y="530" text-anchor="middle" font-size="26" fill="#475569">Maman avait 50 000, achète du poisson (12 800)</text>
  <text x="900" y="565" text-anchor="middle" font-size="26" fill="#475569">Il lui reste 37 200 FCFA</text>
</svg>
