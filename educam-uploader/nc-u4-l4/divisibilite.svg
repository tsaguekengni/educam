<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="675" rx="24" fill="#F8FAFC"/>
  <text x="600" y="72" text-anchor="middle" font-size="40" font-weight="700" fill="#1E293B">Les critères de divisibilité</text>

  <!-- header -->
  <g font-size="24" font-weight="700" fill="#1E293B" text-anchor="middle">
    <rect x="120" y="120" width="150" height="60" fill="#E2E8F0" stroke="#94A3B8"/><text x="195" y="158">Divisible par</text>
    <rect x="270" y="120" width="560" height="60" fill="#E2E8F0" stroke="#94A3B8"/><text x="550" y="158">Règle</text>
    <rect x="830" y="120" width="250" height="60" fill="#E2E8F0" stroke="#94A3B8"/><text x="955" y="158">Exemple</text>
  </g>

  <!-- rows -->
  <g font-size="23" fill="#334155">
    <!-- 2 -->
    <rect x="120" y="180" width="150" height="105" fill="#EFF6FF" stroke="#94A3B8"/><text x="195" y="245" text-anchor="middle" font-size="44" font-weight="700" fill="#2563EB">2</text>
    <rect x="270" y="180" width="560" height="105" fill="#FFFFFF" stroke="#94A3B8"/><text x="290" y="240">le dernier chiffre est pair (0, 2, 4, 6, 8)</text>
    <rect x="830" y="180" width="250" height="105" fill="#FFFFFF" stroke="#94A3B8"/><text x="955" y="240" text-anchor="middle" font-weight="700">246 ✓</text>
    <!-- 3 -->
    <rect x="120" y="285" width="150" height="105" fill="#ECFDF5" stroke="#94A3B8"/><text x="195" y="350" text-anchor="middle" font-size="44" font-weight="700" fill="#059669">3</text>
    <rect x="270" y="285" width="560" height="105" fill="#FFFFFF" stroke="#94A3B8"/><text x="290" y="345">la somme des chiffres est divisible par 3</text>
    <rect x="830" y="285" width="250" height="105" fill="#FFFFFF" stroke="#94A3B8"/><text x="955" y="338" text-anchor="middle" font-weight="700">123 → 6 ✓</text>
    <!-- 5 -->
    <rect x="120" y="390" width="150" height="105" fill="#FEF9E7" stroke="#94A3B8"/><text x="195" y="455" text-anchor="middle" font-size="44" font-weight="700" fill="#D97706">5</text>
    <rect x="270" y="390" width="560" height="105" fill="#FFFFFF" stroke="#94A3B8"/><text x="290" y="450">le dernier chiffre est 0 ou 5</text>
    <rect x="830" y="390" width="250" height="105" fill="#FFFFFF" stroke="#94A3B8"/><text x="955" y="450" text-anchor="middle" font-weight="700">345 ✓</text>
    <!-- 9 -->
    <rect x="120" y="495" width="150" height="105" fill="#FEF2F2" stroke="#94A3B8"/><text x="195" y="560" text-anchor="middle" font-size="44" font-weight="700" fill="#DC2626">9</text>
    <rect x="270" y="495" width="560" height="105" fill="#FFFFFF" stroke="#94A3B8"/><text x="290" y="555">la somme des chiffres est divisible par 9</text>
    <rect x="830" y="495" width="250" height="105" fill="#FFFFFF" stroke="#94A3B8"/><text x="955" y="548" text-anchor="middle" font-weight="700">729 → 18 ✓</text>
  </g>
</svg>
