<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="675" rx="24" fill="#F8FAFC"/>
  <text x="600" y="72" text-anchor="middle" font-size="40" font-weight="700" fill="#1E293B">Écrire un décimal sous forme de fraction</text>

  <!-- Row 1: 0,5 = 5/10 = 1/2  (bar of 10, 5 filled) -->
  <text x="90" y="200" font-size="34" font-weight="700" fill="#2563EB">0,5</text>
  <g>
    <rect x="220" y="165" width="450" height="55" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
    <rect x="220" y="165" width="225" height="55" fill="#93C5FD"/>
    <!-- 10 divisions -->
    <g stroke="#334155" stroke-width="1.5">
      <line x1="265" y1="165" x2="265" y2="220"/><line x1="310" y1="165" x2="310" y2="220"/>
      <line x1="355" y1="165" x2="355" y2="220"/><line x1="400" y1="165" x2="400" y2="220"/>
      <line x1="445" y1="165" x2="445" y2="220"/><line x1="490" y1="165" x2="490" y2="220"/>
      <line x1="535" y1="165" x2="535" y2="220"/><line x1="580" y1="165" x2="580" y2="220"/>
      <line x1="625" y1="165" x2="625" y2="220"/>
    </g>
  </g>
  <text x="720" y="200" font-size="32" font-weight="700" fill="#334155">= 5/10 = 1/2</text>

  <!-- Row 2: 0,25 = 25/100 = 1/4 (bar of 4, 1 filled) -->
  <text x="90" y="350" font-size="34" font-weight="700" fill="#2563EB">0,25</text>
  <g>
    <rect x="220" y="315" width="450" height="55" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
    <rect x="220" y="315" width="112.5" height="55" fill="#6EE7B7"/>
    <g stroke="#334155" stroke-width="1.5">
      <line x1="332.5" y1="315" x2="332.5" y2="370"/><line x1="445" y1="315" x2="445" y2="370"/><line x1="557.5" y1="315" x2="557.5" y2="370"/>
    </g>
  </g>
  <text x="720" y="350" font-size="32" font-weight="700" fill="#334155">= 25/100 = 1/4</text>

  <!-- Row 3: 0,75 = 75/100 = 3/4 (bar of 4, 3 filled) -->
  <text x="90" y="500" font-size="34" font-weight="700" fill="#2563EB">0,75</text>
  <g>
    <rect x="220" y="465" width="450" height="55" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
    <rect x="220" y="465" width="337.5" height="55" fill="#6EE7B7"/>
    <g stroke="#334155" stroke-width="1.5">
      <line x1="332.5" y1="465" x2="332.5" y2="520"/><line x1="445" y1="465" x2="445" y2="520"/><line x1="557.5" y1="465" x2="557.5" y2="520"/>
    </g>
  </g>
  <text x="720" y="500" font-size="32" font-weight="700" fill="#334155">= 75/100 = 3/4</text>

  <text x="600" y="600" text-anchor="middle" font-size="24" fill="#64748B">On simplifie ensuite la fraction quand c'est possible.</text>
</svg>
