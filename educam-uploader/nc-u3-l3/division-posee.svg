<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="675" rx="24" fill="#F8FAFC"/>
  <text x="600" y="80" text-anchor="middle" font-size="40" font-weight="700" fill="#1E293B">Poser la division : 156 ÷ 25</text>

  <!-- Potence -->
  <g font-family="'Courier New', monospace" font-size="60" font-weight="700" fill="#0F172A">
    <text x="230" y="240">156</text>
    <text x="470" y="240">25</text>
    <text x="470" y="330" fill="#D97706">6</text>
    <text x="200" y="330" fill="#DC2626">-150</text>
    <text x="255" y="430" fill="#DC2626">6</text>
  </g>

  <!-- vertical bar of the potence -->
  <line x1="430" y1="200" x2="430" y2="290" stroke="#1E293B" stroke-width="4"/>
  <!-- horizontal bar under divisor (over quotient) -->
  <line x1="430" y1="270" x2="600" y2="270" stroke="#1E293B" stroke-width="4"/>
  <!-- subtraction line -->
  <line x1="195" y1="355" x2="360" y2="355" stroke="#1E293B" stroke-width="4"/>

  <!-- Steps -->
  <g font-size="27" fill="#334155">
    <rect x="680" y="180" width="470" height="270" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
    <text x="705" y="230">1. Dans 156, combien de fois 25 ?</text>
    <text x="705" y="268" font-weight="700" fill="#B45309">   → 6 fois  (25 × 6 = 150)</text>
    <text x="705" y="320">2. On soustrait : 156 − 150 = 6</text>
    <text x="705" y="358" font-weight="700" fill="#991B1B">   → 6 est le reste</text>
    <text x="705" y="410">3. On vérifie : le reste 6</text>
    <text x="705" y="440" font-weight="700" fill="#065F46">   est plus petit que 25  ✓</text>
  </g>

  <!-- labels under the potence -->
  <text x="290" y="500" text-anchor="middle" font-size="22" fill="#DC2626">reste</text>
  <text x="500" y="500" text-anchor="middle" font-size="22" fill="#D97706">quotient</text>
</svg>
