<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="675" rx="24" fill="#F8FAFC"/>
  <text x="600" y="80" text-anchor="middle" font-size="40" font-weight="700" fill="#1E293B">La division euclidienne : 156 ÷ 25</text>

  <!-- Equation tokens -->
  <g font-size="66" font-weight="700" text-anchor="middle">
    <text x="260" y="380" fill="#2563EB">156</text>
    <text x="370" y="380" fill="#334155">=</text>
    <text x="470" y="380" fill="#059669">25</text>
    <text x="560" y="380" fill="#334155">×</text>
    <text x="650" y="380" fill="#D97706">6</text>
    <text x="740" y="380" fill="#334155">+</text>
    <text x="830" y="380" fill="#DC2626">6</text>
  </g>

  <!-- Dividende callout (top-left) -->
  <rect x="120" y="150" width="240" height="66" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="240" y="182" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A8A">Dividende</text>
  <text x="240" y="206" text-anchor="middle" font-size="17" fill="#475569">le nombre qu'on partage</text>
  <line x1="255" y1="216" x2="260" y2="330" stroke="#2563EB" stroke-width="3"/>

  <!-- Quotient callout (top) -->
  <rect x="560" y="150" width="200" height="66" rx="12" fill="#FEF9E7" stroke="#D97706" stroke-width="2"/>
  <text x="660" y="182" text-anchor="middle" font-size="24" font-weight="700" fill="#B45309">Quotient</text>
  <text x="660" y="206" text-anchor="middle" font-size="17" fill="#475569">le résultat</text>
  <line x1="655" y1="216" x2="650" y2="330" stroke="#D97706" stroke-width="3"/>

  <!-- Diviseur callout (bottom) -->
  <rect x="360" y="440" width="220" height="66" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="470" y="472" text-anchor="middle" font-size="24" font-weight="700" fill="#065F46">Diviseur</text>
  <text x="470" y="496" text-anchor="middle" font-size="17" fill="#475569">le nombre de parts</text>
  <line x1="470" y1="440" x2="470" y2="398" stroke="#059669" stroke-width="3"/>

  <!-- Reste callout (bottom) -->
  <rect x="720" y="440" width="220" height="66" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="830" y="472" text-anchor="middle" font-size="24" font-weight="700" fill="#991B1B">Reste</text>
  <text x="830" y="496" text-anchor="middle" font-size="17" fill="#475569">ce qui reste après le partage</text>
  <line x1="830" y1="440" x2="830" y2="398" stroke="#DC2626" stroke-width="3"/>

  <!-- Note -->
  <text x="600" y="600" text-anchor="middle" font-size="26" font-weight="600" fill="#334155">Le reste (6) est toujours plus petit que le diviseur (25).</text>
</svg>
